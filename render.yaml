# Render blueprint for a public DEMO (free plan: the sample data is loaded again whenever the service restarts).
services:
  - type: web
    name: krein-demo
    runtime: docker
    plan: free
    # Free: the service sleeps after 15 minutes without visitors and every restart starts again from the sample data
    # (invitations, new tenants and payments made in the demo are lost). To keep them, use plan: starter and add the disk:
    # disk:
    #   name: krein-data
    #   mountPath: /data
    #   sizeGB: 1
    healthCheckPath: /api/health
    envVars:
      - key: KREIN_SAMPLE_DATA
        value: "1"           # the sample data from sample-data/ (households, co-tenants, bank statements); use KREIN_DEMO_SEED=1 instead for the small built-in demo
      - key: KREIN_SECURE_COOKIES
        value: "1"
      - key: KREIN_DATA_DIR
        value: /data
      - key: KREIN_PUBLIC_URL
        sync: false          # paste your https://....onrender.com address after the first deploy
      - key: KREIN_TIMEZONE
        sync: false          # the country whose date Krein shows, e.g. Europe/Amsterdam or Asia/Dhaka (servers run on UTC, which can be a day behind)
      - key: KREIN_DEMO_PASSWORD
        sync: false          # REQUIRED for a public demo: the password of every demo login (12+ characters, your own choice)
      - key: OPENROUTER_API_KEY
        sync: false          # optional: turns the Help chat into the AI assistant (key from openrouter.ai/settings/keys)
      - key: KREIN_OPENROUTER_MODEL
        value: openai/gpt-oss-20b
      - key: GEMINI_API_KEY
        sync: false          # optional fallback for the Help chat
